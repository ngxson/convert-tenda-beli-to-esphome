esphome:
  name: beli-plug
  friendly_name: Beli Plug

rtl87xx:
  board: tenda-sp3
  family: rtl8710b

wifi:
  id: plug_wifi
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Beli Recovery
    password: !secret fallback_password

captive_portal:

api:
  id: native_api
  # Keep local control working while Home Assistant is unavailable.
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80

logger:
  baud_rate: 115200

# Network health telemetry.
sensor:
  - platform: uptime
    name: Uptime
    update_interval: 10s

  # PA18 changes with the load; one-point estimate from a measured 4.1 W lamp.
  # The meter IC and accuracy at other loads are not established.
  - platform: pulse_meter
    id: plug_power
    name: Power Estimated
    pin:
      number: GPIO18
      mode:
        input: true
        pullup: false
        pulldown: false
    internal_filter_mode: EDGE
    internal_filter: 1ms
    timeout: 30s
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    icon: mdi:flash
    accuracy_decimals: 1
    filters:
      - multiply: 0.15356649
      - lambda: |
          return id(main_plug).state ? x : 0.0f;

button:
  - platform: restart
    name: Restart

# Verified on the tested SP9 V1.0 / RTL8710BX; native pin 12 is PA12.
switch:
  - platform: gpio
    id: main_plug
    name: Main Plug
    pin:
      number: GPIO12
      inverted: false
    restore_mode: ALWAYS_OFF
    on_turn_off:
      - lambda: id(plug_power).publish_state(0.0f);

# PA11 button operation was physically confirmed on this SP9.
# Current flash mode is dual-data (PA11/FD3 unused). Never sweep flash outputs.
binary_sensor:
  - platform: gpio
    id: physical_button
    name: Physical Button
    entity_category: diagnostic
    pin:
      number: GPIO11
      mode:
        input: true
        pullup: true
      inverted: true
    use_interrupt: false
    filters:
      - delayed_on_off: 30ms
    on_press:
      - switch.toggle: main_plug

# PA22 and PA19 are the stock LED outputs, active low.
# Colour assignments are being checked on the first SP9.
output:
  - platform: gpio
    id: led_blue
    pin:
      number: GPIO22
      inverted: true
  - platform: gpio
    id: led_yellow
    pin:
      number: GPIO19
      inverted: true

interval:
  - interval: 100ms
    then:
      - lambda: |-
          // HA identifies itself as "Home Assistant <version>". Ignore loggers,
          // web clients and standalone API tools; reconnects need no counter.
          const bool wifi_connected = id(plug_wifi).is_connected();
          bool ha_connected = false;
          if (wifi_connected) {
            for (const auto &client : id(native_api).active_clients()) {
              if (!client->is_marked_for_removal() && client->is_authenticated() &&
                  strncmp(client->get_name(), "Home Assistant ", 15) == 0) {
                ha_connected = true;
                break;
              }
            }
          }
          // Wi-Fi takes priority over HA. "White" means both LED channels.
          // 0=off, 1=blue, 2=yellow, 3=yellow blink, 4=white, 5=white blink.
          const int mode = !wifi_connected ? (id(main_plug).state ? 4 : 5)
                           : ha_connected ? (id(main_plug).state ? 1 : 0)
                                          : (id(main_plug).state ? 2 : 3);
          static int previous_mode = -1;
          if (mode != previous_mode) {
            const char *labels[] = {"off", "blue", "yellow", "yellow blink", "white", "white blink"};
            ESP_LOGD("plug_led", "Mode: %s", labels[mode]);
            previous_mode = mode;
          }
          // Output mask: blue=1, yellow=2, both=3. Blink at 500 ms on/off.
          const bool blink_on = millis() % 1000 < 500;
          int lit = mode;
          if (mode == 3) lit = blink_on ? 2 : 0;
          if (mode == 4) lit = 3;
          if (mode == 5) lit = blink_on ? 3 : 0;
          static int previous_lit = -1;
          if (lit != previous_lit) {
            // Clear the old colour before applying the new channel combination.
            id(led_blue).turn_off();
            id(led_yellow).turn_off();
            if (lit & 1) id(led_blue).turn_on();
            if (lit & 2) id(led_yellow).turn_on();
            previous_lit = lit;
          }
